[project]
name = "solivros-simulados"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "sqlalchemy>=2.0.36,<3.0.0",
  "psycopg2-binary>=2.9.10,<3.0.0",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.vercel.scripts]
build = "npm run build"
